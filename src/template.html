<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>

<body>
    <main>
        <div class="form-container">
            <button id="unity">°F</button>
            <form id="formCity">
                <label for="searchInput">Search for a city</label>
                <input type="text" name="searchInput" id="searchInput" required>

                <input type="submit" name="submitCity" id="submitCity">
            </form>
        </div>
        <div class="weather-container">
        </div>
        <div class="next-days-container"></div>
    </main>

</body>

</html>
